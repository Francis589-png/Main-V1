name: Repair syntax guard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair known malformed template expression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text()
          broken = "toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} : 'Offline'"
          fixed = "toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : 'Offline'"
          if broken not in text:
              raise SystemExit('Expected malformed expression was not found; refusing to modify app.js')
          path.write_text(text.replace(broken, fixed, 1))
          PY
          node --check app.js
          node --check firebase.js
      - name: Commit repaired syntax
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair app presence template syntax'
          git push origin HEAD:main
