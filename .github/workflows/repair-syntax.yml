name: Repair syntax guard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair known malformed chat presence callback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          broken = ":'Offline';stopTyping="
          fixed = ":'Offline'});stopTyping="
          if broken not in text:
              raise SystemExit('Expected malformed chat callback was not found; refusing to modify app.js')
          path.write_text(text.replace(broken, fixed, 1), encoding='utf-8')
          PY
          node --check app.js
          node --check firebase.js
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './functions/node_modules/*' -not -path './dist/*' -not -path './build/*' -print0 | xargs -0 -r -n1 node --check
      - name: Commit repair and remove temporary guard
        shell: bash
        run: |
          rm -f .github/workflows/repair-syntax.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js .github/workflows/repair-syntax.yml
          git commit -m 'fix: repair chat presence template syntax'
          git push origin HEAD:main
