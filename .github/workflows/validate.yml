name: Validate Main V1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in app.js firebase.js chat-service.js; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              node --check "$file" || exit 1
            fi
          done
          echo "✓ All JavaScript files are syntactically valid"
