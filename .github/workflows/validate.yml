name: Validate Main V1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check Cloud Functions syntax
        run: node --check functions/index.js
      - name: Verify production build configuration script
        run: node --check scripts/build-config.mjs
      - name: Production build
        env:
          FIREBASE_API_KEY: CI_PUBLIC_API_KEY
          FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          FIREBASE_DATABASE_URL: https://ci-default-rtdb.firebaseio.com
          FIREBASE_PROJECT_ID: ci-project
          FIREBASE_STORAGE_BUCKET: ci-project.firebasestorage.app
          FIREBASE_MESSAGING_SENDER_ID: CI_SENDER_ID
          FIREBASE_APP_ID: CI_APP_ID
        run: npm run build
      - name: Validate generated Firebase configuration
        run: node --check firebase-config.js
      - name: Validate generated messaging service worker
        run: node --check firebase-messaging-sw.js
      - name: Firestore security emulator tests
        run: npm run test:rules
